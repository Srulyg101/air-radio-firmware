name: Build firmware

on:
  push:
    branches: [air-radio, air-radio-lean]
    tags: ['v*']
  pull_request:
    branches: [air-radio, air-radio-lean]
  workflow_dispatch:

# Least privilege by default; the release job elevates only for tag pushes.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FLASH_LIMIT: 61440   # 60 KiB, from firmware.ld
      RAM_LIMIT: 16384     # 16 KiB, from firmware.ld
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe in the Makefile

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi libnewlib-arm-none-eabi
          python -m pip install --quiet crcmod
          python --version
          arm-none-eabi-gcc --version | head -1

      - name: Build (warnings are errors via -Werror in Makefile)
        shell: bash
        run: |
          set -o pipefail
          make clean
          make 2>&1 | tee build.log

      - name: Size
        run: arm-none-eabi-size firmware | tee -a build.log

      - name: Verify outputs and limits
        shell: bash
        run: |
          set -euo pipefail
          test -s firmware.bin        || { echo "::error::firmware.bin not produced"; exit 1; }
          test -s firmware.packed.bin || { echo "::error::firmware.packed.bin not produced"; exit 1; }
          read -r TEXT DATA BSS _ < <(arm-none-eabi-size firmware | tail -1)
          FLASH=$((TEXT + DATA)); RAM=$((DATA + BSS))
          if [ "$FLASH" -gt "$FLASH_LIMIT" ]; then echo "::error::Flash overflow: $FLASH > $FLASH_LIMIT"; exit 1; fi
          if [ "$RAM" -gt "$RAM_LIMIT" ]; then echo "::error::RAM overflow: $RAM > $RAM_LIMIT"; exit 1; fi

      - name: Build report
        shell: bash
        run: |
          set -euo pipefail
          read -r TEXT DATA BSS _ < <(arm-none-eabi-size firmware | tail -1)
          FLASH=$((TEXT + DATA)); RAM=$((DATA + BSS))
          {
            echo "AIR RADIO build report"
            echo "commit:            ${GITHUB_SHA}"
            echo "branch/ref:        ${GITHUB_REF_NAME}"
            echo "run:               ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "compiler:          $(arm-none-eabi-gcc --version | head -1)"
            echo "text:              ${TEXT} bytes"
            echo "data:              ${DATA} bytes"
            echo "bss:               ${BSS} bytes"
            echo "flash used:        ${FLASH} / ${FLASH_LIMIT} bytes ($((FLASH * 100 / FLASH_LIMIT))%)"
            echo "flash remaining:   $((FLASH_LIMIT - FLASH)) bytes"
            echo "ram used (static): ${RAM} / ${RAM_LIMIT} bytes ($((RAM * 100 / RAM_LIMIT))%)"
            echo "ram remaining:     $((RAM_LIMIT - RAM)) bytes (stack/heap share this)"
            echo "firmware.bin:        $(stat -c%s firmware.bin) bytes  sha256 $(sha256sum firmware.bin | cut -d' ' -f1)"
            echo "firmware.packed.bin: $(stat -c%s firmware.packed.bin) bytes  sha256 $(sha256sum firmware.packed.bin | cut -d' ' -f1)"
          } | tee build-report.txt
          { echo '```'; cat build-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware + report
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}-${{ github.sha }}
          path: |
            firmware.bin
            firmware.packed.bin
            build-report.txt
            build.log
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}-${{ github.sha }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware.packed.bin
            build-report.txt
